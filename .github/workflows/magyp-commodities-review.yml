name: Actualizar Commodities MAGyP
on:
  schedule:
    # Lunes a viernes, 20:00 Argentina (UTC-3); Actions puede iniciar con demora.
    - cron: '0 23 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha ISO de consulta FOB; vacío = hoy en Argentina. Las otras fuentes consultan su publicación corriente'
        required: false
      source:
        description: 'Familia independiente'
        type: choice
        options: [all, internal, board, fas, fob, futures]
        default: all
permissions:
  contents: read
concurrency:
  group: serie-agricola-data-writer
  queue: max
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Tests offline de referencias
        run: |
          python -m unittest discover -s tests/magyp_common -p test_references.py -v
          python -m unittest discover -s tests/magyp_common -p test_publication.py -v
          node --test tests/magyp_frontend/commodities.test.cjs tests/magyp_frontend/regression.test.cjs tests/magyp_frontend/mcba.test.cjs
      - name: Resolver fecha de consulta
        env:
          MANUAL_DATE: ${{ inputs.date }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          requested = os.environ['MANUAL_DATE'].strip()
          control = datetime.now(ZoneInfo('America/Argentina/Buenos_Aires')).date()
          day = date.fromisoformat(requested) if requested else control
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'REQUESTED_DATE={day.isoformat()}\n')
              output.write(f'CONTROL_DATE={control.isoformat()}\n')
          print(f'[FETCH] Consulta FOB: {day.isoformat()}; control fuentes corrientes: {control.isoformat()}')
          PY
      - name: Descargar, validar y preparar salidas
        id: references
        continue-on-error: true
        env:
          SOURCE: ${{ inputs.source || 'all' }}
        run: python scripts/magyp/grains/references.py --source "$SOURCE" --date "$REQUESTED_DATE" --as-of "$CONTROL_DATE" --allow-web
      - name: Consolidar estado real por familia
        run: python scripts/magyp/build_price_freshness.py
      - name: Validar salidas generadas para el dashboard
        run: |
          python scripts/magyp/grains/validate_publication.py
          python -m unittest discover -s tests/magyp_common -p test_references.py -v
          python -m unittest discover -s tests/magyp_common -p test_publication.py -v
          node --test tests/magyp_frontend/commodities.test.cjs tests/magyp_frontend/regression.test.cjs tests/magyp_frontend/mcba.test.cjs
          git diff --check
      - name: Publicar únicamente CSV livianos en main
        id: publication
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/magyp/dashboard/commodities/internal.csv \
            data/magyp/dashboard/commodities/board.csv \
            data/magyp/dashboard/commodities/fas.csv \
            data/magyp/dashboard/commodities/fob.csv \
            data/magyp/dashboard/commodities/futures.csv \
            data/magyp/reports/PRICE_FRESHNESS_STATUS.json
          python scripts/magyp/grains/validate_publication.py --check-staged
          git diff --cached --check
          python scripts/ci/workflow_status.py plan
          if git diff --cached --quiet; then
            echo '[PUBLISH] Sin cambios en los cinco CSV; no se crea commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: actualizar referencias Commodities MAGyP'
            # Push sin force: si main avanzó, falla y conserva la publicación remota.
            bash scripts/ci/push_data_main.sh
          fi
      - name: Desplegar explícitamente el dashboard validado
        if: github.ref == 'refs/heads/main' && steps.publication.outputs.deploy_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # workflow_dispatch sí dispara Actions con GITHUB_TOKEN; el push por sí solo no.
          # Recuperar un deploy fallido se hace mediante dispatch manual de deploy.yml.
          gh workflow run deploy.yml --ref main
      - name: Evidencia RAW y salidas de la actualización
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: magyp-commodities-review-${{ github.run_id }}
          retention-days: 30
          path: |
            data/magyp/raw/commodities/
            data/magyp/normalized/commodities/
            data/magyp/analytical/commodities/
            data/magyp/dashboard/commodities/
            data/magyp/reports/PRICE_FRESHNESS_STATUS.json
            data/magyp/reports/PRICE_STATE_*.json

      - name: Error visible sólo para fallo de integridad del pipeline
        if: steps.references.outcome == 'failure'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          states=[json.loads(p.read_text()) for p in Path('data/magyp/reports').glob('PRICE_STATE_*.json')]
          if not states or any(r['status']=='PIPELINE_ERROR' for r in states):
              raise SystemExit('PIPELINE_ERROR: revisar metadata; últimas salidas válidas conservadas')
          print('Fuentes con último válido conservado: ' + ', '.join(sorted({r['status'] for r in states})))
          PY

      - name: Resumen final por familia consultada
        if: always()
        env:
          CHANGED: ${{ steps.publication.outcome == 'success' && steps.publication.outputs.changed == 'true' }}
          DEPLOY: ${{ steps.publication.outcome == 'success' && steps.publication.outputs.deploy_required == 'true' }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.ci.workflow_status import summary
          published=json.loads(Path('data/magyp/reports/PRICE_FRESHNESS_STATUS.json').read_text())
          families={r['source_family']:r for r in published['sources']}
          states=list(Path('data/magyp/reports').glob('PRICE_STATE_*.json'))
          if not states: summary('MAGyP_COMMODITIES','PIPELINE_ERROR',os.getenv('REQUESTED_DATE'),None,os.environ['CHANGED'],os.environ['DEPLOY'])
          for path in sorted(states):
              state=json.loads(path.read_text())
              family=path.stem.removeprefix('PRICE_STATE_')
              summary('MAGyP_'+family.upper(),state.get('status','PIPELINE_ERROR'),state.get('requested_date'),families['magyp_'+family].get('last_observation_date'),os.environ['CHANGED'],os.environ['DEPLOY'])
          PY
