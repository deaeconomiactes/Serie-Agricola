name: MAGyP MCBA - actualización productiva manual

on:
  # Activar sólo después del smoke manual exitoso en GitHub/Linux:
  # schedule:
  #   - cron: '0 23 * * *' # Diario, aproximadamente 20:00 Argentina.
  workflow_dispatch:
    inputs:
      requested_date:
        description: Un día ISO YYYY-MM-DD, sin backfill ni retry automático
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: serie-agricola-data-writer
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      MCBA_DATE: ${{ inputs.requested_date }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0 # Tests de regresión comparan contra 5fb5987.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Directorio de captura temporal en runtime
        run: echo "MCBA_CAPTURE_ROOT=$RUNNER_TEMP/mcba-capture" >> "$GITHUB_ENV"
      - name: Dependencias fijadas y Chromium
        run: |
          python -m pip install -r scripts/magyp/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Tests offline antes de la captura
        run: |
          python -m unittest discover -s tests/magyp_common -v
          python -m unittest discover -s tests/magyp_mcba -v
          python -m unittest discover -s tests/ci -v
          node --test tests/magyp_frontend/*.test.cjs
      - name: Captura, normalización, analytical y publicación local validada
        id: capture
        continue-on-error: true
        run: >-
          python scripts/magyp/mcba/update_mcba_dashboard.py
          --date "$MCBA_DATE" --data-root "$MCBA_CAPTURE_ROOT" --allow-web
      - name: Validar bundle final
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        shell: bash
        run: |
          flags=()
          if [ "$CAPTURE_OUTCOME" != success ]; then flags+=(--capture-failed); fi
          python scripts/magyp/mcba/validate_production_mcba.py --requested-date "$MCBA_DATE" "${flags[@]}"
          python -m unittest discover -s tests/magyp_mcba -v
          node --test tests/magyp_frontend/*.test.cjs
          git diff --check
      - name: Publicar exclusivamente salidas MCBA validadas
        if: github.ref == 'refs/heads/main'
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [ "$CAPTURE_OUTCOME" = success ]; then
            git add -- data/magyp/dashboard/mcba/MCBA_MAGYP_DAILY.csv \
              data/magyp/dashboard/mcba/MCBA_MAGYP_DETAIL.csv \
              data/magyp/dashboard/mcba/MCBA_MAGYP_LATEST.csv \
              data/magyp/dashboard/mcba/MCBA_MAGYP_SUMMARY.csv \
              data/magyp/dashboard/mcba/_SUCCESS.json
          else
            flags+=(--capture-failed)
            echo '[PUBLISH] MAGYP_LAST_VALID: conservar todos los CSV; publicar sólo estado.'
          fi
          git add -- data/magyp/dashboard/mcba/MCBA_MAGYP_UPDATE_STATUS.json
          python scripts/magyp/mcba/validate_production_mcba.py --requested-date "$MCBA_DATE" --check-staged "${flags[@]}"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '[PUBLISH] Sin cambios MCBA.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: actualizar MCBA MAGyP y estado de fuente'
            mkdir -p "$MCBA_CAPTURE_ROOT/reports"
            bash scripts/ci/push_data_main.sh 2>&1 | tee "$MCBA_CAPTURE_ROOT/reports/MCBA_PUBLICATION.log"
          fi
      - name: Desplegar Pages explícitamente desde main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      - name: CSV livianos para revisión y posterior publicación manual
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: mcba-pages-candidate
          retention-days: 14
          path: |
            data/magyp/dashboard/mcba/MCBA_MAGYP_DAILY.csv
            data/magyp/dashboard/mcba/MCBA_MAGYP_DETAIL.csv
            data/magyp/dashboard/mcba/MCBA_MAGYP_LATEST.csv
            data/magyp/dashboard/mcba/MCBA_MAGYP_SUMMARY.csv
            data/magyp/dashboard/mcba/MCBA_MAGYP_UPDATE_STATUS.json
            data/magyp/dashboard/mcba/_SUCCESS.json
      - name: Respaldo RAW sin estado de sesión, separado de Pages
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: mcba-raw-audit
          retention-days: 90
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/mcba-capture/raw/mcba/**/manifest.json
            ${{ runner.temp }}/mcba-capture/raw/mcba/**/response.xlsx
      - name: Resultado público del intento
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: mcba-update-diagnostics
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/mcba-capture/reports/MCBA_INTEGRATION_ATTEMPT.json
            ${{ runner.temp }}/mcba-capture/reports/MCBA_PUBLICATION.log
            data/magyp/dashboard/mcba/MCBA_MAGYP_UPDATE_STATUS.json
      - name: Marcar fallo de adquisición aunque el último válido se conserve
        if: ${{ steps.capture.outcome == 'failure' }}
        run: |
          echo '[FETCH] ERROR MCBA; última salida preservada. Consultar diagnóstico MAGYP_LAST_VALID.'
          exit 1
