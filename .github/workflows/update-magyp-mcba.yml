name: MCBA - diagnostico Python Windows
on:
  workflow_dispatch:
    inputs:
      requested_date:
        required: false
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, windows, serie-agricola]
    timeout-minutes: 5
    steps:
      - name: Comprobar Python 3.12 bajo la cuenta del servicio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:\Users\acer\AppData\Local\Programs\Python\Python312\python.exe'
          Write-Output "Cuenta: $([Security.Principal.WindowsIdentity]::GetCurrent().Name)"
          if (!(Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Python 3.12 no existe o no es accesible al servicio; instalar Python 3.12 x64 para todos los usuarios.' }
          try {
            & $python -c "import struct, sys; print('Ejecutable:', sys.executable); print('Version:', sys.version); print('Bits:', struct.calcsize('P') * 8); assert sys.version_info[:2] == (3, 12) and struct.calcsize('P') == 8"
            if ($LASTEXITCODE -ne 0) { throw "Python devolvio codigo $LASTEXITCODE" }
          } catch { throw "El servicio no puede ejecutar Python 3.12 x64: $_. Instalar Python 3.12 x64 para todos los usuarios." }
