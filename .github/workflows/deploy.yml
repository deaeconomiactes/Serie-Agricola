name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - 'AGENTS.md'
      - '.codex/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Desencriptar CSV de datos
        # Usa OpenSSL para recuperar el CSV usando la contraseÃ±a guardada en los Secrets
        env:
          DECRYPT_PASSWORD: ${{ secrets.CSV_PASSWORD }}
        run: |
          CLEAN_PASSWORD=$(echo -n "$DECRYPT_PASSWORD" | tr -d '\r\n')
          openssl enc -aes-256-cbc -d -in "REGISTRO 2025.csv.enc" -out "REGISTRO 2025.csv" \
          -pass pass:"$CLEAN_PASSWORD" -pbkdf2 -iter 10000
          
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Node para adaptadores Mayoristas
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generar y validar fragmentos Mayoristas desde outputs publicados
        run: |
          python scripts/mayoristas/build_dashboard.py
          node --test tests/magyp_frontend/mayoristas-delivery.test.cjs

      - name: Preparar sitio con fragmentos Mayoristas y sin archivos retirados del runtime
        env:
          PAGES_DESTINATION: ${{ runner.temp }}/serie-agricola-pages
        run: python scripts/ci/prepare_pages.py --destination "$PAGES_DESTINATION"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/serie-agricola-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Resumen de Pages
        if: always()
        env:
          FINAL_RESULT: ${{ job.status == 'success' && 'UPDATED' || 'PIPELINE_ERROR' }}
          PUBLISHED: ${{ steps.deployment.outcome == 'success' }}
        run: >-
          python scripts/ci/workflow_status.py summary --source GITHUB_PAGES
          --status "$FINAL_RESULT" --changed "$PUBLISHED" --deploy "$PUBLISHED"
